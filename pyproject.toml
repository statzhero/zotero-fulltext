[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "zotero-fulltext"
version = "0.6.0"
description = "Fast fulltext Zotero MCP for Codex and Claude."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
  { name = "Ulrich Atz", email = "ulrich.atz@unibocconi.it" }
]
dependencies = [
  "mcp>=2.2,<3.0"
]
keywords = ["mcp", "zotero", "claude", "codex", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Text Processing",
]

[project.urls]
Homepage = "https://github.com/statzhero/zotero-fulltext"
Issues = "https://github.com/statzhero/zotero-fulltext/issues"
Changelog = "https://github.com/statzhero/zotero-fulltext/blob/main/CHANGELOG.md"

[project.scripts]
zotero-fulltext = "zotero_fulltext.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zotero_fulltext"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
